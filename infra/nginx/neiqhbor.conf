# WebSocket upgrade mapping (must precede server blocks that reference it)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream puma {
    server 127.0.0.1:3000;
}

# Redirect HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name neiqhbor.com www.neiqhbor.com;

    # Allow health checks over plain HTTP so deploy scripts work before TLS is up
    location = /up {
        proxy_pass http://puma;
        proxy_set_header Host $host;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS – TLS terminated with Cloudflare Origin Certificate
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name neiqhbor.com www.neiqhbor.com;

    ssl_certificate     /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin-key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Security headers (mirrors previous Caddy config)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "DENY"    always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    server_tokens off;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_vary on;
    gzip_min_length 256;

    # Logging
    access_log /var/log/nginx/neiqhbor-access.log;
    error_log  /var/log/nginx/neiqhbor-error.log;

    # Max upload size (Active Storage, avatars, documents)
    client_max_body_size 25M;

    location / {
        proxy_pass http://puma;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port  $server_port;

        proxy_redirect off;

        # WebSocket support (Action Cable)
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # Serve precompiled assets directly when RAILS_SERVE_STATIC_FILES is off
    location /assets/ {
        root /opt/tatl/apps/portal/public;
        expires max;
        add_header Cache-Control "public, immutable";
        try_files $uri @puma;
    }

    location @puma {
        proxy_pass http://puma;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port  $server_port;
    }
}
