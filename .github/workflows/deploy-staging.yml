name: Deploy to Staging

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [develop]

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to staging
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    environment: staging
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: deploy
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: /opt/tatl/infra/scripts/deploy.sh
          command_timeout: 5m

      - name: Smoke test
        run: |
          sleep 5
          STATUS=$(curl -sf -o /dev/null -w "%{http_code}" "http://${{ secrets.STAGING_HOST }}/up" || echo "000")
          if [[ "$STATUS" == "200" ]]; then
            echo "Staging is healthy (HTTP 200)"
          else
            echo "ERROR: Staging health check returned HTTP ${STATUS}"
            exit 1
          fi
